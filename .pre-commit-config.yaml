default_stages: [pre-commit, pre-push]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-docstring-first
      - id: check-yaml
      - id: check-toml
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.10
    hooks:
      - id: ruff
        args: [--fix]
  - repo: https://github.com/psf/black-pre-commit-mirror
    rev: 26.10.0
    hooks:
      - id: black
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.4.1
    hooks:
      - id: mypy
        name: mypy --strict
        files: ^(src|tests)/
        args: [--strict]
        # Same runtime dependencies as CI so the hermetic hook type-checks the
        # real third-party APIs (pyproject [tool.mypy] supplies the rest).
        additional_dependencies:
          - asf_search
          - pandas
          - pyarrow
          - "pydantic>=2"
          - pyyaml
          - tqdm
          - tenacity
          - pytest
          - pytest-cov

ci:
  autoupdate_schedule: monthly
